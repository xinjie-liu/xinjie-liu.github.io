          <!-- Link buttons under the homepage subtitle; usernames come from _config.yml -->
          <div class="profile-links">
            <a href="{{ '/static/resume/xinjie_cv.pdf' | relative_url }}"><i class="fas fa-file-pdf" aria-hidden="true"></i> CV</a>
            {%- if site.email %}
            <a href="mailto:{{ site.email }}"><i class="fas fa-envelope" aria-hidden="true"></i> Email</a>
            {%- endif %}
            {%- if site.scholar_userid %}
            <a href="https://scholar.google.com/citations?user={{ site.scholar_userid }}"><i class="ai ai-google-scholar" aria-hidden="true"></i> Google Scholar</a>

            {%- if site.github_username %}
            <a href="https://github.com/{{ site.github_username }}"><i class="fab fa-github" aria-hidden="true"></i> GitHub</a>
            {%- endif %}
            {%- if site.linkedin_username %}

            {%- endif %}
